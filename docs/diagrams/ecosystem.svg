<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title{font-size:24px;font-weight:700;fill:#0f172a}
    .sub{font-size:13px;fill:#64748b}
    .lbl{font-size:15px;font-weight:700;fill:#0f172a}
    .desc{font-size:12px;fill:#334155}
    .file{font-size:11px;font-weight:700;fill:#1e293b;font-family:Consolas,monospace}
    .grp{font-size:12px;font-weight:700;fill:#475569}
    .edge{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a4)}
    .note{font-size:11px;fill:#64748b}
  </style>
  <defs><marker id="a4" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#334155"/></marker></defs>

  <text x="40" y="44" class="title">Écosystème OpenPoint — où se place ce moteur de rendu</text>
  <text x="40" y="66" class="sub">Le LMS affiche des supports de cours. Ce dépôt convertit les fichiers Office en Web, sans PowerPoint/Word.</text>

  <!-- Instructeurs / supports -->
  <rect x="40" y="110" width="200" height="150" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="140" y="136" text-anchor="middle" class="lbl">Supports de cours</text>
  <text x="140" y="156" text-anchor="middle" class="desc">créés par les instructeurs</text>
  <rect x="62" y="172" width="156" height="30" rx="7" fill="#fff" stroke="#6366f1"/>
  <text x="140" y="192" text-anchor="middle" class="file">.pptx  (diapos)</text>
  <rect x="62" y="212" width="156" height="30" rx="7" fill="#fff" stroke="#6366f1"/>
  <text x="140" y="232" text-anchor="middle" class="file">.docx  (documents)</text>

  <!-- CE DEPOT : moteur -->
  <rect x="330" y="96" width="420" height="300" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="540" y="124" text-anchor="middle" class="lbl">OpenPoint  (CE DÉPÔT)</text>
  <text x="540" y="143" text-anchor="middle" class="grp">moteur de rendu Office → Web</text>

  <rect x="352" y="162" width="180" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="442" y="186" text-anchor="middle" class="lbl">Moteurs JS</text>
  <text x="442" y="205" text-anchor="middle" class="file">pptx-render.mjs</text>
  <text x="442" y="221" text-anchor="middle" class="file">docx-build.mjs</text>

  <rect x="548" y="162" width="180" height="70" rx="10" fill="#f1f5f9" stroke="#0ea5e9"/>
  <text x="638" y="186" text-anchor="middle" class="lbl">Voie fidèle</text>
  <text x="638" y="205" text-anchor="middle" class="file">office-to-pdf.mjs</text>
  <text x="638" y="221" text-anchor="middle" class="desc">(LibreOffice)</text>

  <rect x="352" y="248" width="376" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="368" y="270" class="grp">Sorties</text>
  <rect x="366" y="282" width="112" height="42" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="422" y="300" text-anchor="middle" class="desc" font-weight="700">viewer.html</text>
  <text x="422" y="316" text-anchor="middle" class="note">défilement</text>
  <rect x="488" y="282" width="120" height="42" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="548" y="300" text-anchor="middle" class="desc" font-weight="700">player-out.html</text>
  <text x="548" y="316" text-anchor="middle" class="note">présentation animée</text>
  <rect x="618" y="282" width="96" height="42" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="666" y="300" text-anchor="middle" class="desc" font-weight="700">docx-out.html</text>
  <text x="666" y="316" text-anchor="middle" class="note">pages A4</text>
  <rect x="366" y="332" width="180" height="36" rx="8" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="456" y="355" text-anchor="middle" class="desc" font-weight="700">PDF fidèle (pixel-perfect)</text>

  <path d="M240 185 L352 195" class="edge"/>
  <path d="M240 227 L352 210" class="edge"/>

  <!-- LMS -->
  <rect x="840" y="96" width="200" height="300" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="940" y="124" text-anchor="middle" class="lbl">le LMS</text>
  <text x="940" y="142" text-anchor="middle" class="grp">le produit</text>
  <rect x="862" y="160" width="156" height="66" rx="9" fill="#fff" stroke="#16a34a"/>
  <text x="940" y="182" text-anchor="middle" class="desc" font-weight="700">FRONT</text>
  <text x="940" y="200" text-anchor="middle" class="note">Front (web)</text>
  <text x="940" y="216" text-anchor="middle" class="note">intègre les pages</text>
  <rect x="862" y="238" width="156" height="76" rx="9" fill="#fff" stroke="#16a34a"/>
  <text x="940" y="260" text-anchor="middle" class="desc" font-weight="700">BACK</text>
  <text x="940" y="278" text-anchor="middle" class="note">Back (API)</text>
  <text x="940" y="294" text-anchor="middle" class="note">sert les pages</text>
  <text x="940" y="310" text-anchor="middle" class="note">+ l'API</text>
  <rect x="862" y="326" width="156" height="52" rx="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="940" y="348" text-anchor="middle" class="desc" font-weight="700">Utilisateurs</text>
  <text x="940" y="365" text-anchor="middle" class="note">consultent les cours</text>

  <path d="M750 246 L840 246" class="edge"/>
  <text x="762" y="238" class="note">intègre le HTML/PDF</text>

  <text x="40" y="450" class="grp">Origine du dépôt</text>
  <text x="40" y="472" class="note">Né du besoin d'afficher des PowerPoint animés dans le LMS sans PowerPoint (POC les suites bureautiques abandonné). Le reverse du moteur</text>
  <text x="40" y="490" class="note">d'animation (docs/moteur-animation.md, binaire-ppcore.md…) a prouvé la faisabilité ; le moteur de rendu maison en découle.</text>
  <text x="40" y="516" class="note">NB : le renderer est un dépôt SÉPARÉ du LMS. Il produit des fichiers Web que le LMS peut ensuite intégrer/servir.</text>
</svg>
